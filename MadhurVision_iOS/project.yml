name: MadhurVision
options:
  bundleIdPrefix: com.madhur
targets:
  MadhurVision:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources: [Sources]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access is required for VR tracking."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone access is required for VR voice search and voice commands."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Local network access is required to connect to the PC."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIStatusBarHidden: "YES"
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: "NO"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
